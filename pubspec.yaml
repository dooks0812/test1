name: car_wash_app
description: IoT-Based Car Wash Monitoring System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  intl: ^0.18.1
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # Firebase (Web-safe)
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.0.0

  # Local notifications (foreground alerts)
  flutter_local_notifications: ^17.0.0

  # JS interop (web)
  # ✅ FIX: must be 0.6.x to be compatible with flutter_secure_storage_web
  js: ^0.6.7

  # Maps & Navigation
  google_maps_flutter: ^2.6.1
  url_launcher: ^6.3.0
  geolocator: ^10.1.0

  # State management
  provider: ^6.1.1

  # EmailJS / HTTP
  http: ^1.2.0

  # Biometric login
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.0

  # Face capture + face detection (Android)
  image_picker: ^1.2.1
  google_mlkit_face_detection: ^0.13.1
  image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
